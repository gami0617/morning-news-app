name: Hourly News Dispatcher

on:
  schedule:
    # 5分ごとにチェック（0分, 5分, 10分...）
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase requests feedparser

      - name: Run Python script
        run: python main.py
