<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朝ニュース自動配信 登録画面</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f4f9; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
    input[type="email"], input[type="time"], button { width: 100%; padding: 0.75rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    .checkbox-label { display: flex; align-items: center; gap: 0.5rem; font-weight: normal; cursor: pointer; }
    button { background-color: #007bff; color: white; border: none; cursor: pointer; margin-top: 1rem; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    #message { margin-top: 1rem; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h1>朝ニュース自動配信 登録</h1>
    <form id="subscribe-form">
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" required placeholder="example@gmail.com">
      </div>
      <div class="form-group">
        <label for="dispatch-time">配信希望時間（分単位）</label>
        <input type="time" id="dispatch-time" required value="07:00">
      </div>
      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" id="is-active" checked style="width: auto;"> ニュース配信を有効にする（オン）
        </label>
      </div>
      <button type="submit">設定を保存する</button>
    </form>
    <div id="message"></div>
  </div>
　<script>
    const SUPABASE_URL = "https://lalbvmmigfkthliihjil.supabase.co";
    const SUPABASE_KEY = "sb_publishable_g7WYzExhUw4-ivkla-GURQ_luS59YLN"; // ご自身のPublishable Key

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('subscribe-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const dispatch_time = document.getElementById('dispatch-time').value;
      const is_active = document.getElementById('is-active').checked;
      const messageDiv = document.getElementById('message');

      messageDiv.textContent = '保存中...';
      messageDiv.style.color = 'black';

      // エラー詳細を確認するため、レスポンス全体を取得
      const response = await supabaseClient
        .from('subscribers')
        .upsert([{ email, dispatch_time, is_active }], { onConflict: 'email' });

      console.log('Supabase Response:', response); // コンソールに詳細を出力

      if (response.error) {
        // エラー内容を画面上にも赤字で直接表示する
        messageDiv.textContent = '保存失敗: ' + response.error.message;
        messageDiv.style.color = 'red';
      } else {
        const statusText = is_active ? '配信「オン」で保存しました！' : '配信を「オフ（停止）」にしました！';
        messageDiv.textContent = statusText;
        messageDiv.style.color = 'green';
      }
    });
  </script>
　
  
</body>
</html>
